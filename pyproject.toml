[project]
name = "pc-assembly-rag"
version = "0.1.0"
description = "Asistente inteligente de ensamble de PCs con compatibilidad, grafos de dependencias y RAG sobre manuales oficiales"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Juan José Díaz", email = "jjdiazr@eafit.edu.co" }
]
dependencies = [
    "pandas>=2.2.0",
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "networkx>=3.2.0",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
